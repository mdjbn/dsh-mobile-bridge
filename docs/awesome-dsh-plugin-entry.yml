name: 1045188196/dsh-mobile-bridge
category: remote
description:
  en: 'Lets a DSH server that has no USB access drive a phone plugged into a Windows PC: one single-file bridge on the PC owns adb, fastboot, the adb server and the COM ports, and the plugin exposes them as pc_mobile_* tools over a token-protected HTTP API.'
  zh: '让没有 USB 的 DSH 服务器也能操作插在 Windows PC 上的手机：PC 端跑一个单文件控制端，持有 adb、fastboot、adb server 与 COM 口，插件通过带 token 的 HTTP API 把它暴露成 pc_mobile_* 工具。'
